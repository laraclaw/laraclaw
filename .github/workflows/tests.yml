name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, redis
          coverage: none

      - name: Pin framework versions for this matrix cell
        run: |
          composer require --no-update --no-interaction \
            "laravel/framework:${{ matrix.laravel }}"
          composer require --no-update --no-interaction --dev \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  audit:
    runs-on: ubuntu-latest

    name: Composer audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, redis
          coverage: none

      - name: Audit the committed lock file
        run: composer audit --locked --no-interaction
